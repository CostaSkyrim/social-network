services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: social-backend
    expose:
      - "8080"
    volumes:
      - .:/app
      - ./backend/configs.docker.json:/app/backend/configs.json
      - go_mod_cache:/go/pkg/mod
      - backend_db:/app/backend/data/db
      - backend_images:/app/backend/data/images
    networks:
      - social-net
    depends_on:
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: social-frontend
    expose:
      - "3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.ts:/app/next.config.ts
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost
      - WATCHPACK_POLLING=true
    networks:
      - social-net
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: social-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - social-net
    depends_on:
      - frontend
      - backend

  redis:
    image: redis:7-alpine
    container_name: social-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - social-net
    restart: unless-stopped

volumes:
  go_mod_cache:
  backend_db:
  backend_images:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  social-net:
    driver: bridge
