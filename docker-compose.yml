services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: social-backend
    expose:
      - "8080"
    volumes:
      - .:/app
      - ./backend/configs.docker.json:/app/backend/configs.json
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - backend_db:/app/backend/data/db
      - backend_images:/app/backend/data/images
    environment:
      # Secrets live in .env (gitignored); Compose interpolates them here.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    networks:
      - social-net
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: social-frontend
    expose:
      - "3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.ts:/app/next.config.ts
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost
      - WATCHPACK_POLLING=true
    networks:
      - social-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: social-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - social-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: social-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - social-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  go_mod_cache:
  go_build_cache:
  backend_db:
  backend_images:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  social-net:
    driver: bridge
