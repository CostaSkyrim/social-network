root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./backend/cmd"
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontend", "node_modules", ".git"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  stop_on_error = true

[log]
  time = false

[color]
  build = "yellow"
  runner = "green"
  watcher = "cyan"
